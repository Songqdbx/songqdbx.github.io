<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="完成20道第五人格排位知识题，查看你的测评段位。" />
    <meta name="theme-color" content="#171615" />
    <title>第五人格排位段位测评</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="fog fog-a" aria-hidden="true"></div>
    <div class="fog fog-b" aria-hidden="true"></div>
    <div class="page-frame" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand" aria-label="第五人格排位段位测评">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span class="brand-copy">
          <b>庄园排位档案</b>
          <small>RANKED AWARENESS ARCHIVE</small>
        </span>
      </header>

      <section id="start-screen" class="screen start-screen" aria-labelledby="main-title">
        <div class="seal" aria-hidden="true">
          <span>20</span>
          <small>QUESTIONS</small>
        </div>
        <p class="eyebrow">一份写给排位玩家的庄园档案</p>
        <h1 id="main-title">第五人格<br /><em>排位段位测评</em></h1>
        <p class="intro">20 道排位知识题，检验你对地图、机制与细节的掌握。</p>
        <div class="meta-row" aria-label="测评说明">
          <span><b>20</b> 道单选题</span>
          <i aria-hidden="true"></i>
          <span><b>约 3</b> 分钟</span>
          <i aria-hidden="true"></i>
          <span><b>满分 20</b> 分</span>
        </div>
        <button id="start-button" class="primary-button" type="button">
          <span>开启测评</span><b aria-hidden="true">→</b>
        </button>
        <p class="fine-print">本测评为玩家趣味内容，与游戏官方无关</p>
      </section>

      <section id="quiz-screen" class="screen quiz-screen" aria-live="polite" hidden>
        <div class="quiz-topline">
          <div>
            <span class="chapter">RANKED ARCHIVE</span>
            <p><span id="question-number">01</span><small> / 20</small></p>
          </div>
          <div class="progress-wrap" aria-label="答题进度">
            <div class="progress-track"><span id="progress-bar"></span></div>
            <small id="progress-text">进度 5%</small>
          </div>
        </div>

        <div class="question-card">
          <span class="card-corner corner-tl" aria-hidden="true"></span>
          <span class="card-corner corner-br" aria-hidden="true"></span>
          <p class="question-label">QUESTION <span id="question-label-number">01</span></p>
          <h2 id="question-text"></h2>
          <div id="options" class="options" role="group" aria-labelledby="question-text"></div>
          <p class="choice-hint">选择后将自动进入下一题，答案将在全部完成后结算</p>
        </div>
      </section>

      <section id="result-screen" class="screen result-screen" aria-labelledby="result-title" hidden>
        <p class="eyebrow">庄园档案已完成</p>
        <div class="score-ring" aria-label="测评得分">
          <svg viewBox="0 0 140 140" aria-hidden="true">
            <circle class="ring-bg" cx="70" cy="70" r="61"></circle>
            <circle id="score-arc" class="ring-value" cx="70" cy="70" r="61"></circle>
          </svg>
          <div><strong id="score">0</strong><span>/ 20</span></div>
        </div>
        <p class="result-kicker">你的排位意识段位</p>
        <h2 id="result-title"></h2>
        <div class="rank-divider" aria-hidden="true"><i></i><span>✦</span><i></i></div>
        <p id="result-copy" class="result-copy"></p>
        <p id="result-stat" class="result-stat"></p>
        <p class="result-contact">正确答案可小红书联系 <b>133qdbx</b> 获取</p>
        <button id="restart-button" class="secondary-button" type="button">重新测评</button>
      </section>
    </main>

    <footer>制作人：133</footer>
    <script src="./app.js" defer></script>
  </body>
</html>
